services:
  - type: web
    name: adelfos-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    domains:
      - api.adelfosmarketing.com
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://adelfosmarketing.com
      - key: DB_NAME
        value: adelfos
      - key: MONGO_URL
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false

name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Detect construction mode
        id: construction-mode
        run: |
          if grep -Eq '^[[:space:]]*export const UNDER_CONSTRUCTION_MODE = true;[[:space:]]*$' frontend/src/config/construction.js; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Under-construction mode is enabled; backend checks will be skipped."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Under-construction mode is disabled; backend checks are required."
          fi

      - name: Validate production backend URL
        if: steps.construction-mode.outputs.enabled != 'true'
        env:
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL }}
        run: |
          if [ -z "$REACT_APP_BACKEND_URL" ]; then
            echo "::error::Set the repository Actions variable REACT_APP_BACKEND_URL to the public backend origin before deploying."
            exit 1
          fi
          case "$REACT_APP_BACKEND_URL" in
            https://*) ;;
            *) echo "::error::REACT_APP_BACKEND_URL must use HTTPS."; exit 1 ;;
          esac
          if [[ "$REACT_APP_BACKEND_URL" == */ ]]; then
            echo "::error::REACT_APP_BACKEND_URL must not end with a slash."
            exit 1
          fi

      - name: Check production backend health
        if: steps.construction-mode.outputs.enabled != 'true'
        env:
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors --max-time 40 \
            "$REACT_APP_BACKEND_URL/api/" --output "$RUNNER_TEMP/backend-health.json"
          grep -Eq '"service"[[:space:]]*:[[:space:]]*"adelfos-api"' "$RUNNER_TEMP/backend-health.json"

      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL }}
          REACT_APP_SITE_URL: https://adelfosmarketing.com
        run: |
          yarn build
          cp build/index.html build/404.html
          printf '%s\n' 'adelfosmarketing.com' > build/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4